name: Actualizar feeds de texto completo

on:
  schedule:
    - cron: "*/15 * * * *"   # cada 15 min; cambia a */5 para cada 5
  workflow_dispatch:
  push:
    paths: ["feeds.txt", "build_feeds.py"]

permissions:
  contents: write

concurrency:
  group: feeds
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generar feeds
        env:
          BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python build_feeds.py
      - name: Publicar cambios
        run: |
          git config user.name "feeds-bot"
          git config user.email "feeds-bot@users.noreply.github.com"
          git add -A docs cache.json
          git diff --cached --quiet || (git commit -m "Actualizar feeds" && git push)
